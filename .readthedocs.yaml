version: 2

mkdocs:
  configuration: mddocs/mkdocs.yml

build:
  os: ubuntu-26.04
  tools:
    python: '3.14'
  jobs:
    post_create_environment:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m pip install uv
    post_install:
      # do not install bonsai
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --no-install-project --extra backend --extra postgres --group mddocs
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m pip list -v
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH make docs-openapi
    pre_build:
      - python mddocs/scripts/fix_refs.py
      - python mddocs/scripts/links2anchors.py
